<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox
  id="__addonRef__-prefpane"
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
  onunload="Zotero.__addonInstance__.hooks.onPrefsEvent('unload', { window })"
>
  <label><html:h2 data-l10n-id="pref-title"></html:h2></label>

  <vbox id="__addonRef__-wrap-rows">
    <html:h3 data-l10n-id="pref-wrap-rows-title"></html:h3>
    <vbox id="__addonRef__-wrap-rows-list"></vbox>
    <html:p
      class="__addonRef__-pref-hint"
      data-l10n-id="pref-wrap-rows-hint"
    ></html:p>
  </vbox>

  <separator class="thin" />

  <vbox id="__addonRef__-wrap-columns">
    <html:h3 data-l10n-id="pref-wrap-columns-title"></html:h3>
    <vbox id="__addonRef__-wrap-columns-list"></vbox>
    <html:p
      class="__addonRef__-pref-hint"
      data-l10n-id="pref-wrap-columns-hint"
    ></html:p>
  </vbox>

  <separator class="thin" />

  <vbox id="__addonRef__-auto-fit">
    <html:h3 data-l10n-id="pref-auto-fit-title"></html:h3>
    <checkbox
      id="__addonRef__-auto-fit-width-on-load"
      data-l10n-id="pref-auto-fit-width-on-load"
      preference="autoFitWidthOnLoad"
    />
    <checkbox
      id="__addonRef__-auto-fit-font-on-load"
      data-l10n-id="pref-auto-fit-font-on-load"
      preference="autoFitFontOnLoad"
    />
    <html:p
      class="__addonRef__-pref-hint"
      data-l10n-id="pref-auto-fit-hint"
    ></html:p>
  </vbox>
</groupbox>
<vbox>
  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
  ></html:label>
</vbox>
